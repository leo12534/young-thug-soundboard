  <meta name="description" content="Young Thug Soundboard & Adlibs">

  <title>Young Thug Adlibs</title>

<body>
  <div class="page">
    <header class="header">
      <div class="header__bar">
        <span class="header__badge">🐍 Soundboard</span>
        <a class="header__social" href="https://twitter.com/leofbermeo" target="_blank" rel="noopener">@leofbermeo</a>
      </div>
      <h1 class="header__title">
        <span class="header__title-emoji" aria-hidden="true">🐍</span>
        <span>Young Thug <span class="header__title-accent">Adlibs</span></span>
        <span class="header__title-emoji" aria-hidden="true">🐍</span>
      </h1>
      <p class="header__intro">
        Press a key or tap a pad. Got an adlib that should be on here?
        <a href="https://twitter.com/leofbermeo" target="_blank" rel="noopener">Let me know</a>.
      </p>
    </header>

    <main class="content">
      <div class="content__keys">
        <div class="content__keys-row">
          <button type="button" data-key="1" class="content__keys-item">
            <span class="adlib__thugger"></span>
            <kbd class="content__keys-kbd">1</kbd>
            <span class="content__keys-label">Machine Gun</span>
          </button>
