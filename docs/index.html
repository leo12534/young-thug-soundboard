<body>
  <section class="thug__container">
    <section class="thug__wrapper" onclick="void(0);">
      <header class="header">
        <div class="header__socials">
          <a class="header__socials-twitter" href="https://twitter.com/leofbermeo" target="_blank"
            rel="noopener">@leofbermeo</a>
        </div>
        <div class="header__heading">
          <span class="header__heading-emoji">🐍</span>
          <h1 class="header__heading-text">Young Thug Adlibs </h1>
          <span class="header__heading-emoji">🐍</span>
        </div>
        <p class="header__intro">A <a class="header__intro-links" href="https://github.com/leo12534/thugger"
            target="_blank" rel="noopener">personal
            project</a> for one of my favorite rappers. <a class="header__intro-links"
            href="https://twitter.com/leofbermeo" target="_blank" rel="noopener">Follow me</a> on twitter if you have
          any
          suggestions for the list</p>
      </header>
